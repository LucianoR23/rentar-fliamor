name: Daily Contract Expiration

on:
  schedule:
    - cron: '0 10 * * *'   # 7:00 AM ART (UTC-3) todos los dias — antes de alertas
  workflow_dispatch:         # disparo manual desde GitHub UI

jobs:
  expire-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar /api/cron/expire-contracts
        run: |
          curl --fail --silent --show-error \
            -X GET "${{ secrets.APP_URL }}/api/cron/expire-contracts" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
